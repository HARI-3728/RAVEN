[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "raven"
version = "0.1.0"
description = "RAVEN - Multi-AI Development Workspace for terminal"
requires-python = ">=3.11"
license = "MIT"

# Dependencies
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.1",
]

# Project URLs
project-urls = {
    "Homepage": "https://github.com/your-org/raven",
    "Documentation": "https://github.com/your-org/raven/docs",
    "Source": "https://github.com/your-org/raven",
}

# Classifiers
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console :: Cursive",
]

[project.scripts]
raven = "raven.main:main"

[tool.pytest]
asyncio_mode = "auto"
testpaths = [
    "tests/",
]
verbose = true
python_files = [
    "tests/**/test_*.py",
]
python_classes = []

[tool.setuptools.packages.find]
where = ["src"]