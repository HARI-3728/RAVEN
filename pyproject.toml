
[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "0.1.0"
description = "RAVEN - Multi-AI Development Workspace for terminal"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console :: Curses",
]
dependencies = [
    "textual>=0.50.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "google-genai",
    "anthropic>=0.30.0",
    "aiosqlite>=0.19.0",
    "GitPython>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/raven"
Documentation = "https://github.com/your-org/raven/docs"
Source = "https://github.com/your-org/raven"

[project.scripts]
raven = "raven.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["src"]
