[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "0.1.0"
description = "RAVEN - Multi-AI Development Workspace for terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "textual>=0.80.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
    "pydantic>=2.9.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "anyio>=4.6.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "anthropic>=0.37.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/raven"
Documentation = "https://github.com/your-org/raven/docs"
Source = "https://github.com/your-org/raven"

[project.scripts]
raven = "raven.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.setuptools.packages.find]
where = ["src"]
