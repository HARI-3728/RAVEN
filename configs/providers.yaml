# RAVEN Provider Configuration
# Provider configurations for AI model integrations

# OpenAI provider
openai:
  api_key_env: OPENAI_API_KEY
  default_model: gpt-4o
  supported_models:
    - gpt-4o
    - gpt-4-turbo
    - gpt-3.5-turbo
  timeout: 30
  max_retries: 2
  # Format prompt: System/User message pair

# Google Gemini provider
gemini:
  api_key_env: GEMINI_API_KEY
  default_model: gemini-1.5-flash
  supported_models:
    - gemini-1.5-flash
    - gemini-1.5-pro
    - gemini-1.0-pro
  timeout: 30
  max_retries: 2

# Anthropic provider
anthropic:
  api_key_env: ANTHROPIC_API_KEY
  default_model: claude-3-opus-20240229
  supported_models:
    - claude-3-opus-20240229
    - claude-3-sonnet-20240229
    - claude-3-haiku-20240307
  timeout: 30
  max_retries: 2

# OpenAI-compatible provider (Together, Bedrock, etc.)
openai_compatible:
  api_key_env: OPENAI_COMPATIBLE_API_KEY
  base_url: https://api.openai.com/v1
  default_model: gpt-4o
  supported_models:
    - gpt-4o
    - gpt-4-turbo
    - gpt-3.5-turbo
  timeout: 30
  max_retries: 2

# Local/offline provider (Ollama)
local:
  api_key_env: ""  # Not required for local models
  default_model: codellama:34b
  supported_models:
    - codellama:34b
    - llama3:8b
    - mixtral:8b
  timeout: 60
  max_retries: 3
  ollama_base_url: http://localhost:11434